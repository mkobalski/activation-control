# =============================================================================
# Attention-recording experiment (probes register/sink claims).
#
# For each (concept, sentence, condition) trial, we:
#   1. Greedy-generate the sentence transcription.
#   2. Run a single forward pass on (prompt + generated) with output_attentions=True.
#   3. For each query position in the sentence span and each layer in
#      `analysis_layers`, sum attention mass over keys grouped by token class
#      (the / a / and / , / . / hello / special / content).
#
# Stored: aggregated per-class attention mass (not raw attention tensors).
# =============================================================================

experiment:
  name: "write_introspection_attn"
  seed: 42
  temperature: 0.0
  max_new_tokens: 64
  num_repetitions: 1
  token_buffer: 10
  batch_size: 1            # one trial at a time to keep memory predictable

model:
  name: "gemma3_27b"
  config_path: "configs/models/gemma3_27b.yaml"
  dtype: "bfloat16"
  quantization: null
  device: "cuda"
  attn_implementation: "eager"

# 10 layers spread across the 62-layer model.
analysis_layers:
  fractions: []
  layers: [0, 6, 12, 20, 30, 40, 45, 50, 55, 61]

prompt_layers:
  fractions: []
  layers: []

concept_vectors:
  method: "baseline"
  template: "Tell me about {word}"
  token_idx: -1
  normalize: false
  n_baseline_words: 100
  cache_dir: "results/vector_cache"

concepts:
  - "Denim"
  - "Lightning"
  - "Volcanoes"
  - "Bread"
  - "Trees"
  - "Cameras"
  - "Vegetables"
  - "Milk"
  - "Dynasties"
  - "Deserts"

# Register-rich sentences only (skip the original 5 neutrals and hello-15).
sentences:
  - "The cat watched the bird through the window by the door near the garden."
  - "A cat watched a bird through a window by a door near a garden."
  - "She bought milk, bread, eggs, butter, jam, cheese, sugar, flour, and rice."
  - "She likes apples and pears and plums and peaches and grapes and lemons."
  - "She ran. He walked. They stopped. The dog barked. The bird sang. The day ended."

prompt_conditions:
  - id: "think_intensely"
    template: 'Write "{sentence}" exactly. Think intensely about {concept} while you write. Don''t write anything else.'
    kind: "positive"
    has_layer: false
  - id: "dont_think_about"
    template: 'Write "{sentence}" exactly. Do not think about {concept} while you write. Don''t write anything else.'
    kind: "negative"
    has_layer: false

compliance:
  method: "normalized_levenshtein"
  threshold: 0.85

wandb:
  project: "write-introspection-main"
  entity: null
  tags: ["write-introspection", "gemma3", "attention"]

output:
  base_dir: "results"
