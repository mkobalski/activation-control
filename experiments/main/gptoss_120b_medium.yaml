# MAIN experiment on gpt-oss-120b at reasoning_effort=MEDIUM. The middle sibling
# of gptoss_120b_low/high.yaml — SAME weights (openai/gpt-oss-120b via
# MODEL_NAME_MAP), only the harmony reasoning_effort differs. Kept as a separate
# short name so run dirs / concept-vector cache / SCORES / cross-model bars treat
# the three effort levels as distinct points. Inherits everything from config.yaml.
#
# NOTES:
#  - MXFP4 is the native weight format (~63 GB); leave quantization null and do
#    NOT add bitsandbytes 8bit/4bit on top (that path is NF4 and wrong here).
#  - reasoning_effort "medium": the harmony `analysis` (CoT) channel sits between
#    low (~10 tokens measured) and high (hundreds+). The recorder still locates
#    the target sentence in the FINAL channel and records only that span to disk
#    (see src/utils/harmony.py), so pickle SIZE is unchanged vs low.
extends: config.yaml

model:
  name: "gptoss_120b_medium"
  config_path: "configs/models/gptoss_120b_medium.yaml"
  quantization: null
  reasoning_effort: "medium"

experiment:
  # Room for a medium-length CoT before the final sentence; no medium CoT length
  # has been measured — probe with a 1-sentence smoke and tune DOWN (watch for
  # `CAP!` lines, which mean the cap truncated the final channel).
  max_new_tokens: 2048
  # Recorder holds activations for EVERY generated step up to max_new_tokens
  # until the final-channel span is sliced (see gptoss_120b_high.yaml). Sized for
  # a 141 GB H200 (~66 GB weights + ~70 GB headroom); on an 80 GB card drop to 4.
  batch_size: 8
