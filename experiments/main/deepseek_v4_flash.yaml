# MAIN experiment on DeepSeek-V4-Flash. MoE 284B total / 13B active, native
# BLOCK-WISE FP8 (weight_block_size=[128,128], e4m3, dynamic activation scale).
#
# FP8 IS PRESERVED with quantization: null -- transformers reads the checkpoint's
# embedded quantization_config and keeps the weights in FP8 via the finegrained-
# fp8 kernel; dtype: bfloat16 (inherited) is only the compute/activation dtype.
# Do NOT set quantization to 8bit/4bit (that is bitsandbytes NF4 and wrong). The
# Ministral tensor-mode FP8 dequant shim does NOT fire here (weight_block_size is
# not None), so nothing is upcast.
#
# NO Jinja chat template: builder._chat_wrap falls back to the bare
# "User:/Assistant:" scaffold automatically. HYBRID whose thinking toggle lives in
# DeepSeek's own encoding scripts, not a template kwarg -- so this bare-prompt run
# has no explicit thinking-off switch. VERIFY the smoke compliance: if the model
# emits a stray CoT and compliance is low, it needs the repo's DeepSeek encoding
# (a think-tag parser + larger max_new_tokens). ~2x B200.
extends: config.yaml

model:
  name: "deepseek_v4_flash"
  config_path: "configs/models/deepseek_v4_flash.yaml"
  quantization: null
