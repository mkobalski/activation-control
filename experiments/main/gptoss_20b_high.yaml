# MAIN experiment on gpt-oss-20b at reasoning_effort=HIGH. Effort sibling of
# gptoss_20b_low.yaml — SAME weights (openai/gpt-oss-20b via MODEL_NAME_MAP),
# only the harmony reasoning_effort differs; separate short name so run dirs /
# concept-vector cache / SCORES treat effort levels as distinct points.
# Inherits everything from config.yaml.
#
# NOTES:
#  - MXFP4 native (~13 GB); quantization stays null, no bitsandbytes on top.
#  - high-effort CoT length: expected hundreds-to-low-thousands of tokens; tune DOWN after the probe.
#    The recorder slices the FINAL channel span to disk (src/utils/harmony.py),
#    so pickle SIZE is unchanged vs low; the CoT costs VRAM (transient recording
#    buffer up to max_new_tokens) and TIME only. Watch for CAP! lines.
extends: config.yaml

model:
  name: "gptoss_20b_high"
  config_path: "configs/models/gptoss_20b_low.yaml"
  quantization: null
  reasoning_effort: "high"

experiment:
  max_new_tokens: 4096
  # Deliberately NOT pinned low: ~13 GB weights leave huge headroom on an 80 GB
  # card, and the 120b smokes (2026-07-23) showed effort runs are CoT-throughput
  # bound — large batches are the fix. Probe upward from here (see runbook).
  batch_size: 32
